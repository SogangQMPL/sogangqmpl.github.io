<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">Electrical control of an interlayer exciton</title>
  <desc id="desc">One electron in the upper atomically thin layer binds to one hole in the lower layer. Three patterned electrode pads below the bilayer and a downward electric-field arrow represent electrical tuning and confinement. The device geometry is conceptual.</desc>
