<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
<title id="title">Optically and electrically controlled 2D transistor</title>
<desc id="desc">A single conceptual field-effect transistor. Source and drain contacts sit on an atomically thin semiconductor channel above an insulating dielectric and a back gate. An incoming light wave and gate-field arrows indicate optical and electrical control. This is a platform illustration, not a measured device.</desc>
<defs>
  <marker id="field" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6b5793" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="light" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#26736f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="600" height="400" fill="#fff"/>
<g stroke-linejoin="round" stroke-linecap="round" stroke-width="2.5">
  <!-- Back gate beneath the insulating slab. -->
  <path d="M90 278 218 212H518L390 278Z" fill="#e7dff0" stroke="#6b5793"/>
  <path d="M90 278H390V294H90Z" fill="#c9bada" stroke="#6b5793"/>
  <path d="m390 278 128-66v16l-128 66Z" fill="#d9cde6" stroke="#6b5793"/>
  <!-- Dielectric physically separates gate and channel. -->
  <path d="M90 238 218 172H518L390 238Z" fill="#f5f2f9" stroke="#a99bbd"/>
  <path d="M90 238H390V278H90Z" fill="#faf8fc" stroke="#a99bbd"/>
  <path d="m390 238 128-66v40l-128 66Z" fill="#eee8f4" stroke="#a99bbd"/>
  <!-- Atomically thin channel and source/drain contact pads. -->
  <path d="m124 230 92-47h266l-92 47Z" fill="#c9bddb" stroke="#6b5793"/>
  <path d="M124 230H390" fill="none" stroke="#6b5793" stroke-width="4"/>
  <path d="m124 212 92-47h58l-92 47Z" fill="#e4edf5" stroke="#315f8c"/>
  <path d="M124 212h58v18h-58Z" fill="#bdcfe0" stroke="#315f8c"/>
  <path d="m182 212 92-47v18l-92 47Z" fill="#cfdeeb" stroke="#315f8c"/>
  <path d="m332 212 92-47h58l-92 47Z" fill="#e4edf5" stroke="#315f8c"/>
  <path d="M332 212h58v18h-58Z" fill="#bdcfe0" stroke="#315f8c"/>
  <path d="m390 212 92-47v18l-92 47Z" fill="#cfdeeb" stroke="#315f8c"/>
  <!-- Sparse field and photon motifs, without labels or extra panels. -->
  <path d="M278 270v-23" fill="none" stroke="#6b5793" marker-end="url(#field)"/>
  <path d="M286 64c-17 11 17 20 0 31s17 20 0 31 17 20 0 31v24" fill="none" stroke="#26736f" stroke-width="3" marker-end="url(#light)"/>
  <circle cx="286" cy="202" r="6" fill="#26736f" stroke="#fff" stroke-width="2"/>
  <path d="M90 286H58" fill="none" stroke="#6b5793"/>
  <circle cx="51" cy="286" r="6" fill="#fff" stroke="#6b5793"/>
</g>
</svg>
