<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" role="img" aria-labelledby="title desc">
  <title id="title">Quantum information</title>
  <desc id="desc">An atom symbol with three crossing orbits and a central node, redrawn from the research map as a conceptual research-area icon.</desc>
  <g fill="none" stroke="#315f8c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="40" cy="40" rx="29" ry="11" transform="rotate(-30 40 40)"/>
    <ellipse cx="40" cy="40" rx="29" ry="11" transform="rotate(30 40 40)"/>
    <ellipse cx="40" cy="40" rx="29" ry="11" transform="rotate(90 40 40)"/>
  </g>
  <circle cx="40" cy="40" r="7" fill="#f2f6fb"/>
  <circle cx="40" cy="40" r="4.5" fill="#315f8c"/>
</svg>
