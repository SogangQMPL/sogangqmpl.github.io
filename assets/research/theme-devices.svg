<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" width="420" height="300" role="img" aria-labelledby="title desc">
<title id="title">Two-dimensional semiconductor transistor</title>
<desc id="desc">Conceptual cross section of a gated two-dimensional transistor with source, drain, dielectric and a thin semiconductor channel; not a measured device cross section.</desc>
<defs>
 <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#002e5d"/></marker>
 <marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7860bb"/></marker>
</defs>
<g font-family="Inter,Arial,sans-serif" fill="#002e5d">
 <text x="210" y="41" text-anchor="middle" font-size="17" font-weight="500">Gated 2D semiconductor</text>
 <rect x="47" y="206" width="326" height="26" fill="#eef1f5" stroke="#bec7d2" stroke-width="1.3"/>
 <rect x="47" y="187" width="326" height="19" fill="#fafbfc" stroke="#bec7d2" stroke-width="1.3"/>
 <path d="M57 186H363" stroke="#7860bb" stroke-width="5"/>
 <rect x="51" y="154" width="74" height="32" fill="#d6dee8" stroke="#002e5d" stroke-width="1.8"/>
 <rect x="295" y="154" width="74" height="32" fill="#d6dee8" stroke="#002e5d" stroke-width="1.8"/>
 <rect x="151" y="127" width="118" height="55" fill="#f1eef8" stroke="#c7bce1" stroke-width="1.5"/>
 <rect x="165" y="97" width="90" height="29" fill="#e5dff0" stroke="#7860bb" stroke-width="1.8"/>
 <text x="88" y="144" text-anchor="middle" font-size="15">Source</text>
 <text x="210" y="79" text-anchor="middle" font-size="15">Gate</text>
 <text x="332" y="144" text-anchor="middle" font-size="15">Drain</text>
 <path d="M210 136V173" fill="none" stroke="#7860bb" stroke-width="1.8" stroke-dasharray="3 3" marker-end="url(#b)"/>
 <path d="M137 187H283" fill="none" stroke="#002e5d" stroke-width="1.4" marker-end="url(#a)"/>
 <path d="M275 188L306 260" fill="none" stroke="#98a5b5" stroke-width="1.3"/>
 <text x="244" y="281" font-size="15" fill="#68717d">2D channel</text>
