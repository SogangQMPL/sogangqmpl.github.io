<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#ffffff">
  <title>404 · Page not found | QMPL</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <style>
    @font-face {
      font-family: Quicksand;
      src: url("/assets/fonts/Quicksand.woff2") format("woff2");
      font-weight: 300 700;
      font-display: swap;
    }
    :root {
      --navy: #002e5d;
      --purple: #68469f;
      --ink: #28303b;
      --muted: #566170;
      --line: #e6e8ed;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      margin: 0;
      background: #fff;
      color: var(--ink);
      font: 1rem/1.6 system-ui, sans-serif;
    }
    h1, p { margin: 0; }
    .frame { width: min(1056px, calc(100% - 48px)); margin-inline: auto; }
    .masthead { border-bottom: 1px solid var(--line); }
    .masthead .frame { display: flex; align-items: center; gap: 16px; min-height: 75px; }
    .brand {
      color: var(--navy);
      font: 700 1.6rem/1 Quicksand, system-ui, sans-serif;
      text-decoration: none;
    }
    .lab-name { color: var(--muted); font-size: .875rem; line-height: 1.35; }
    main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, .95fr);
      align-items: center;
      gap: clamp(24px, 6vw, 80px);
      flex: 1;
      padding-block: clamp(40px, 8vh, 88px);
    }
    .error-code {
      color: var(--purple);
      font: 700 clamp(6rem, 12vw, 9rem)/.95 Quicksand, system-ui, sans-serif;
      letter-spacing: -.055em;
    }
    h1 { margin-top: 20px; font-size: clamp(1.85rem, 4vw, 2.75rem); line-height: 1.15; letter-spacing: -.045em; }
    .explanation { max-width: 34ch; margin-top: 14px; color: var(--muted); }
    .home-link {
      display: inline-flex;
      align-items: center;
      gap: .65em;
      min-height: 46px;
      margin-top: 26px;
      padding: 10px 18px;
      border-radius: 6px;
      background: var(--navy);
      color: #fff;
      font-weight: 600;
      text-decoration: none;
    }
    .home-link:hover { background: var(--purple); }
    a:focus-visible { outline: 2px solid var(--purple); outline-offset: 5px; }
    .illustration { display: block; width: 100%; max-width: 440px; height: auto; justify-self: center; }
    footer { border-top: 1px solid var(--line); color: var(--muted); font-size: .875rem; }
    footer .frame { padding-block: 17px; }
    @media (max-width: 640px) {
      .frame { width: calc(100% - 40px); }
      .masthead .frame { min-height: 66px; gap: 12px; }
      main { grid-template-columns: minmax(0, 1fr); gap: 25px; padding-block: 40px 26px; text-align: center; }
      .error-code { font-size: clamp(4.9rem, 21vw, 6rem); }
      .explanation { margin-inline: auto; }
      .illustration { max-width: 280px; }
      footer .frame { text-align: center; }
    }
  </style>
</head>
<body>
  <header class="masthead">
    <div class="frame">
      <a class="brand" href="/" aria-label="QMPL home">QMPL</a>
      <p class="lab-name">Quantum Materials &amp; Photonics Lab</p>
    </div>
  </header>
  <main class="frame">
    <div>
      <p class="error-code">404</p>
      <h1>Page not found</h1>
      <p class="explanation">The page may have moved or the address may be incorrect.</p>
      <a class="home-link" href="/"><span aria-hidden="true">←</span> Back to Home</a>
    </div>
    <svg class="illustration" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 428 344" width="428" height="344" aria-hidden="true" focusable="false">
      <!-- A vacancy in a layered lattice is a visual cue for the missing page. -->
      <defs>
        <g id="lattice-row">
          <circle r="3.5"/><circle cx="-27" cy="12" r="3.5"/><circle cx="-54" cy="24" r="3.5"/>
          <circle cx="-81" cy="36" r="3.5"/><circle cx="-108" cy="48" r="3.5"/>
        </g>
        <path id="layer" d="m214 98 126 61-126 61-126-61z"/>
      </defs>
      <circle cx="214" cy="172" r="153" fill="#f6f3fa"/>
      <circle cx="214" cy="172" r="128" fill="none" stroke="#e9e1f1"/>
      <path d="m88 205 126 61 126-61v10l-126 61-126-61z" fill="#aebed7"/>
      <path d="m214 266 126-61v10l-126 61z" fill="#8a9fbf"/>
      <use href="#layer" y="46" fill="#e0e9f4" stroke="#b4c5dd" stroke-width="1.5"/>
      <path d="m88 182 126 61 126-61v8l-126 61-126-61z" fill="#c1b2d8"/>
      <path d="m214 243 126-61v8l-126 61z" fill="#a28cbf"/>
      <use href="#layer" y="23" fill="#e9e0f2" stroke="#c7b9db" stroke-width="1.5"/>
      <path d="m88 159 126 61 126-61v8l-126 61-126-61z" fill="#c7b9dd"/>
      <path d="m214 220 126-61v8l-126 61z" fill="#aa95c6"/>
      <use href="#layer" fill="#fdfbff" stroke="#c7b9db" stroke-width="1.5"/>
      <g fill="none" stroke="#c0aed9" stroke-width="1.6">
        <path d="M214 111 106 159M241 123 133 171M268 135 241 147M187 171 160 183M295 147 187 195M322 159 214 207"/>
        <path d="M214 111 322 159M187 123 295 171M160 135 187 147M241 171 268 183M133 147 241 195M106 159 214 207"/>
      </g>
      <g fill="#8063ab">
        <use href="#lattice-row" x="214" y="111"/><use href="#lattice-row" x="241" y="123"/>
        <circle cx="268" cy="135" r="3.5"/><circle cx="241" cy="147" r="3.5"/>
        <circle cx="187" cy="171" r="3.5"/><circle cx="160" cy="183" r="3.5"/>
        <use href="#lattice-row" x="295" y="147"/><use href="#lattice-row" x="322" y="159"/>
      </g>
      <circle cx="214" cy="159" r="11" fill="#f3edf8" stroke="#8c6db5" stroke-width="1.6" stroke-dasharray="3 4"/>
      <path d="M143 74c29-15 65-7 76 17 6 13 2 28-4 47" fill="none" stroke="#8c6db5" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 6"/>
      <circle cx="143" cy="74" r="4.5" fill="#68469f"/>
      <circle cx="318" cy="104" r="3" fill="#b9a7d0"/>
      <circle cx="118" cy="244" r="3" fill="#b9a7d0"/>
    </svg>
  </main>
  <footer>
    <p class="frame">Department of Physics · Sogang University</p>
  </footer>
</body>
</html>
